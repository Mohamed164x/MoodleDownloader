name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm deps + sync
        run: |
          npm install
          npx cap sync android

      - name: Patch @capacitor-community/http namespace
        run: |
          cd node_modules/@capacitor-community/http/android
          sed -i "s|    compileSdkVersion project.hasProperty('compileSdkVersion')|    namespace 'com.getcapacitor.http.http'\n    compileSdkVersion project.hasProperty('compileSdkVersion')|" build.gradle
          echo "=== build.gradle namespace ==="
          grep -A2 'android {' build.gradle | head -4

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KFU_Moodle_Downloader-apk
          path: web/android/app/build/outputs/apk/debug/app-debug.apk